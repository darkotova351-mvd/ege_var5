<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13 из 13 — первая часть профильного ЕГЭ</title>
  <style>
    :root {
      --bg: #f6f8f3;
      --card: #ffffff;
      --ink: #1d2a25;
      --muted: #69756f;
      --green: #34765b;
      --green-dark: #245741;
      --green-soft: #e5f0e9;
      --mint: #b9d9c8;
      --blue: #4e7f8c;
      --blue-soft: #e3f0f3;
      --yellow: #a67824;
      --yellow-soft: #fff1cf;
      --orange: #b96839;
      --orange-soft: #fbe8dc;
      --gray: #7d8581;
      --gray-soft: #edf0ee;
      --red: #a84e4e;
      --red-soft: #f8e8e8;
      --line: #dce4df;
      --shadow: 0 18px 55px rgba(39, 66, 53, .11);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 2%, rgba(185, 217, 200, .35), transparent 28rem),
        radial-gradient(circle at 92% 94%, rgba(219, 228, 203, .42), transparent 26rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .shell { width: min(1060px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 38px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 20px; }
    .brand { color: var(--green-dark); font-weight: 800; letter-spacing: -.02em; }
    .timer { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .card {
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(220,228,223,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .start-card { padding: clamp(30px, 6vw, 70px); max-width: 820px; margin: 8vh auto 0; text-align: center; }
    .eyebrow { color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 4px; font-size: clamp(48px, 8vw, 82px); line-height: 1; letter-spacing: -.06em; }
    .subtitle { margin: 0; color: var(--muted); font-size: clamp(18px, 2.8vw, 25px); }
    .variant { display: inline-flex; align-items: center; gap: 8px; margin: 22px 0 28px; padding: 8px 13px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); font-weight: 750; }
    .start-form { max-width: 520px; margin: 0 auto; text-align: left; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 750; }
    .text-input, .answer-input {
      width: 100%; border: 1.5px solid #cfdad4; background: #fff; color: var(--ink); border-radius: 14px;
      outline: none; transition: border-color .18s ease, box-shadow .18s ease;
    }
    .text-input { height: 54px; padding: 0 16px; }
    .answer-input { height: 58px; padding: 0 18px; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .text-input:focus, .answer-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(52,118,91,.12); }
    .field-error { min-height: 22px; margin-top: 6px; color: var(--red); font-size: 13px; }
    .instructions { display: grid; gap: 9px; margin: 24px auto 26px; max-width: 590px; color: #44524b; text-align: left; }
    .instruction { display: flex; gap: 11px; align-items: flex-start; }
    .instruction b { flex: 0 0 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); font-size: 12px; }
    .task-count { margin-top: 13px; color: var(--muted); font-size: 14px; }

    .btn {
      min-height: 48px; padding: 11px 19px; border: 0; border-radius: 13px; cursor: pointer; font-weight: 780;
      transition: transform .16s ease, background .16s ease, opacity .16s ease, box-shadow .16s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(52,118,91,.2); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: var(--green-soft); color: var(--green-dark); }
    .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn-danger { background: var(--red-soft); color: var(--red); }
    .btn-wide { width: 100%; }

    .resume-box { margin: 0 auto 25px; max-width: 590px; padding: 16px; border-radius: 16px; background: #fbfcfa; border: 1px solid var(--line); text-align: left; }
    .resume-box strong { display: block; margin-bottom: 4px; }
    .resume-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }

    .progress-wrap { padding: 14px 16px; margin-bottom: 18px; }
    .progress { display: grid; grid-template-columns: repeat(13, minmax(28px, 1fr)); gap: 6px; }
    .progress-item {
      height: 34px; border-radius: 9px; border: 1px solid var(--line); background: #f8faf8; color: var(--muted);
      position: relative; display: grid; place-items: center; font-size: 12px; font-weight: 800; cursor: default;
    }
    .progress-item.current { border: 2px solid var(--green); color: var(--green-dark); background: #fff; outline: 3px solid rgba(52,118,91,.2); outline-offset: 2px; }
    .progress-item.clickable { cursor: pointer; }
    .progress-item.in-progress { background: #eaf1f3; border-color: #b9cbd0; color: #526d75; }
    .progress-item.first { background: var(--green-soft); border-color: #b6d4c3; color: var(--green-dark); }
    .progress-item.corrected { background: var(--blue-soft); border-color: #bad9df; color: #315e68; }
    .progress-item.hint { background: var(--yellow-soft); border-color: #eddba9; color: #805c1d; }
    .progress-item.solution { background: var(--orange-soft); border-color: #efc7ae; color: #8f4825; }
    .progress-item.skipped { background: var(--gray-soft); border-color: #d6dcda; color: #626a66; }
    .progress-item .progress-mark { position: absolute; right: 3px; bottom: 0; font-size: 9px; line-height: 1; }
    .work-actions { display: flex; justify-content: flex-end; margin: -8px 0 18px; }
    .work-actions .btn { min-height: 40px; padding: 8px 14px; font-size: 13px; }

    .question-card { padding: clamp(22px, 4vw, 42px); }
    .question-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 25px; }
    .question-head h2 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.035em; }
    .counter { color: var(--muted); font-weight: 720; font-variant-numeric: tabular-nums; }
    .review-badge { display: inline-flex; margin-top: 6px; padding: 5px 9px; border-radius: 999px; background: var(--gray-soft); color: var(--gray); font-size: 12px; font-weight: 800; }
    .question-text { font-family: Georgia, "Times New Roman", serif; font-size: clamp(18px, 2.45vw, 23px); line-height: 1.58; }
    .question-text p { margin: 0 0 13px; }
    .math { white-space: nowrap; }
    .formula-center { margin: 18px 0; text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 1.18em; }
    .frac { display: inline-grid; grid-template-rows: auto auto; vertical-align: -.45em; text-align: center; line-height: 1.05; margin: 0 .12em; }
    .frac > span:first-child { border-bottom: 1.4px solid currentColor; padding: 0 .18em .1em; }
    .frac > span:last-child { padding: .1em .18em 0; }
    .lottery { width: 100%; margin: 20px 0; border-collapse: collapse; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; }
    .lottery th, .lottery td { padding: 10px 9px; border: 1px solid #cad4cf; text-align: center; }
    .lottery th:first-child, .lottery td:first-child { text-align: left; white-space: nowrap; }
    .visual { margin: 22px auto; max-width: 680px; border-radius: 18px; background: #fbfcfa; border: 1px solid #e4ebe7; overflow: hidden; }
    .visual img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    .answer-area { max-width: 460px; margin-top: 26px; }
    .answer-label { margin-bottom: 8px; color: var(--muted); font-size: 14px; font-weight: 750; }
    .feedback { display: none; margin-top: 15px; padding: 14px 16px; border-radius: 14px; font-weight: 700; }
    .feedback.show { display: block; }
    .feedback.error { color: #843f3f; background: var(--red-soft); }
    .feedback.success { color: var(--green-dark); background: var(--green-soft); }
    .feedback.note { color: #315e68; background: var(--blue-soft); }
    .help-panel { display: none; margin-top: 17px; }
    .help-panel.show { display: block; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .hint-box { margin-top: 12px; padding: 14px 16px; background: var(--yellow-soft); border-left: 4px solid #d4a13d; border-radius: 10px; color: #684c1a; }
    .hint-box strong { display: block; margin-bottom: 3px; }
    .solution-box { margin-top: 23px; padding: 21px; border-radius: 17px; background: #f8faf8; border: 1px solid var(--line); }
    .solution-box h3 { margin: 0 0 14px; font-size: 20px; }
    .solution-box ol { margin: 0; padding-left: 23px; }
    .solution-box li + li { margin-top: 9px; }
    .solution-box .answer { margin-top: 14px; color: var(--green-dark); font-weight: 850; }
    .status-summary { margin-top: 19px; padding: 15px 17px; border-radius: 15px; background: #f8faf8; border: 1px solid var(--line); }
    .status-summary strong { display: block; }
    .status-summary span { color: var(--muted); font-size: 14px; }
    .motivation { min-height: 27px; margin: 4px 0 10px; color: var(--green-dark); font-size: 13px; font-weight: 800; text-align: center; }
    .overlay { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 18px; background: rgba(24,35,30,.46); backdrop-filter: blur(4px); }
    .overlay.show { display: grid; }
    .dialog { width: min(480px, 100%); padding: 26px; border-radius: 20px; background: #fff; box-shadow: 0 24px 80px rgba(0,0,0,.22); }
    .dialog h3 { margin: 0 0 9px; font-size: 23px; }
    .dialog p { margin: 0; color: var(--muted); white-space: pre-line; }

    .final-card { padding: clamp(24px, 5vw, 52px); }
    .final-head { text-align: center; }
    .final-head h1 { font-size: clamp(35px, 6vw, 58px); letter-spacing: -.045em; }
    .score-label { margin-top: 25px; color: var(--muted); }
    .score { margin: 3px 0 20px; color: var(--green-dark); font-size: clamp(52px, 9vw, 82px); font-weight: 900; letter-spacing: -.05em; line-height: 1; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 25px 0; }
    .stat { min-height: 105px; padding: 15px 10px; border-radius: 16px; text-align: center; border: 1px solid var(--line); background: #fbfcfb; }
    .stat b { display: block; font-size: 29px; }
    .stat span { color: var(--muted); font-size: 12px; line-height: 1.25; }
    .result-map { display: grid; grid-template-columns: repeat(13, 1fr); gap: 7px; margin-top: 14px; }
    .map-item { min-height: 48px; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); font-weight: 850; }
    .map-item small { display: block; font-size: 9px; line-height: 1; }
    .legend { display: flex; flex-wrap: wrap; gap: 9px 16px; margin-top: 14px; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; }
    .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 28px 0; }
    .analysis-box { padding: 20px; border-radius: 18px; border: 1px solid var(--line); background: #fbfcfb; }
    .analysis-box h3 { margin: 0 0 10px; font-size: 18px; }
    .analysis-box p { margin: 0; color: var(--muted); }
    .final-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 26px; }

    @media (max-width: 780px) {
      .shell { width: min(100% - 20px, 1060px); padding-top: 15px; }
      .topbar { margin-bottom: 12px; }
      .progress-wrap { padding: 10px; overflow-x: auto; }
      .progress { min-width: 540px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat:last-child { grid-column: 1 / -1; }
      .result-map { grid-template-columns: repeat(7, 1fr); }
      .analysis-grid { grid-template-columns: 1fr; }
      .lottery { font-size: 12px; }
      .lottery th, .lottery td { padding: 7px 5px; }
    }
    @media (max-width: 520px) {
      .start-card, .question-card, .final-card { border-radius: 19px; }
      .brand { font-size: 14px; }
      .timer { font-size: 12px; }
      .button-row .btn { width: 100%; }
      .question-head { align-items: flex-start; }
      .question-text { font-size: 18px; }
      .lottery-wrap { overflow-x: auto; }
      .lottery { min-width: 580px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>

      };

      return {
        version: 3, studentName: name.trim(), currentIndex: 0, started: true, finished: false,
        createdAt: Date.now(), completedAt: null,
        questions: questionDefinitions.map(freshQuestion)
      };

    function safeLoad() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.version !== 3 || !Array.isArray(parsed.questions) || parsed.questions.length !== 13) return null;
        parsed.questions.forEach(q => { q.segmentStarted = null; });
        return parsed;
      } catch (_) { return null; }
    }

    function save() {
      if (!state) return;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function clearSaved() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function normalizeAnswer(value) {
      const cleaned = String(value).replace(/[\s\u00A0\u202F]/g, '').replace(',', '.');
      if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned)) return null;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : null;
    }

    function answersEqual(input, correct) {
      const a = normalizeAnswer(input);
      const b = normalizeAnswer(correct);
      return a !== null && b !== null && Math.abs(a - b) < 1e-9;
    }

    function formatTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return hours > 0
        ? `${hours}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`
        : `${minutes}:${String(seconds).padStart(2,'0')}`;
    }

    function questionElapsed(q) {
      return q.elapsedTime + (q.segmentStarted ? Date.now() - q.segmentStarted : 0);
    }

    function totalElapsed() {
      if (!state) return 0;
      return state.questions.reduce((sum, q) => sum + questionElapsed(q), 0);
    }

    function beginTiming(q) {
      if (!q.completed && !q.segmentStarted) {
        q.visited = true;
        q.segmentStarted = Date.now();
        if (!q.startTime) q.startTime = q.segmentStarted;
        save();
      }
    }

    function stopTiming(q) {
      if (q.segmentStarted) {
        q.elapsedTime += Date.now() - q.segmentStarted;
        q.segmentStarted = null;
      }
    }

    function allQuestionsCompleted() {
      return state.questions.every(q => q.completed);
    }

    function resumeWork(saved) {
      state = saved;
      state.questions.forEach(q => { q.segmentStarted = null; });
      renderCurrent();
    }

    function completionButtonLabel(q) {
      const prefix = q.viewedSolution ? 'Понятно → ' : '';
      return prefix + (allQuestionsCompleted() ? 'Завершить тренировку' : 'Следующее незавершённое');
    }

          <label for="studentName">Имя ученика</label><input class="text-input" id="studentName" autocomplete="name" maxlength="70" aria-describedby="nameError"><div class="field-error" id="nameError"></div>
          <div class="instructions"><div class="instruction"><b>1</b><span>Решай задания в любом порядке — выбирай номер сверху.</span></div><div class="instruction"><b>2</b><span>Балл начисляется только за верный ответ с первой попытки.</span></div><div class="instruction"><b>3</b><span>Если после ошибки нужна помощь, можно воспользоваться подсказкой или посмотреть решение.</span></div></div>
          <button class="btn btn-primary btn-wide" type="submit">Начать тренировку</button><div class="task-count">13 заданий</div>
        </form>
      </section></div>`;
      if (saved) {
        document.getElementById('resumeBtn').addEventListener('click', () => resumeWork(saved));
        document.getElementById('newBtn').addEventListener('click', () => confirmDialog('Начать заново?', 'Текущий прогресс будет удалён.', 'Начать заново', () => { clearSaved(); renderStart(null); }));
      }
      const form = document.getElementById('startForm');
      if (form) form.addEventListener('submit', e => {
        e.preventDefault(); const input = document.getElementById('studentName'); const name = input.value.trim();
        if (!name) { document.getElementById('nameError').textContent = 'Введите имя ученика.'; input.focus(); return; }
        state = createState(name); save(); renderCurrent();
      });
    }

    function progressHtml(activeIndex) {
      return `<div class="card progress-wrap"><div class="progress" aria-label="Прогресс по заданиям">${state.questions.map((q, i) => {
        const workingMeta = q.visited && !q.completed ? { label: 'В работе', className: 'in-progress' } : null;
        const meta = q.status ? statusMeta[q.status] : workingMeta;
        const classes = ['progress-item'];
        if (i === activeIndex) classes.push('current');
        if (meta) classes.push(meta.className);
        classes.push('clickable');
        const label = meta ? `${q.number}: ${meta.label}` : `${q.number}: ещё не открыто`;
        const mark = workingMeta ? '<small class="progress-mark" aria-hidden="true">◷</small>' : '';
        return `<button class="${classes.join(' ')}" type="button" data-question="${i}" aria-label="${label}">${q.number}${mark}</button>`;
      }).join('')}</div></div>`;
    }

    function renderCurrent(message = '') {
      if (!state) return renderStart(safeLoad());
      if (state.finished) return renderFinal();
      const activeIndex = state.currentIndex;
      const q = state.questions[activeIndex];
      const def = questionDefinitions[activeIndex];
      beginTiming(q);
      const completed = q.completed;
      const meta = q.status ? statusMeta[q.status] : null;
      const firstWrong = q.attempts > 0 && q.firstAttemptCorrect === false && !completed;
      const hintHtml = q.hintCount ? `<div>${def.hints.slice(0, q.hintCount).map((hint, i) => `<div class="hint-box"><strong>Подсказка ${i+1}</strong>${hint}</div>`).join('')}</div>` : '';
      const persistentMessage = !message && firstWrong ? 'Первая попытка была неверной. Попробуй ещё раз.' : message;
      const feedbackClass = persistentMessage.startsWith('✓') ? 'success' : persistentMessage ? 'error' : '';
      const completionNotice = completed && message ? `<div class="feedback show success">${escapeHtml(message)}</div>` : '';
      const completionDetail = q.status === 'corrected'
        ? 'Первая попытка была неверной, поэтому экзаменационный балл не начисляется.'
        : q.status === 'hint'
          ? 'Ответ найден с помощью подсказки, поэтому экзаменационный балл не начисляется.'
          : `Балл за первую попытку: ${q.score}`;
      const completionText = completed && meta ? `<div class="status-summary"><strong>${meta.symbol} ${meta.label}</strong><span>${completionDetail}</span></div>` : '';
      const solutionHtml = q.viewedSolution ? `<div class="solution-box"><h3>Решение</h3>${def.solution}</div>` : '';
      const answerControls = !completed ? `<div class="answer-area"><div class="answer-label">Ответ</div><input class="answer-input" id="answerInput" inputmode="decimal" autocomplete="off" value="${escapeHtml(q.currentAnswer || '')}" aria-describedby="answerError"><div class="field-error" id="answerError"></div><div class="feedback ${persistentMessage ? 'show '+feedbackClass : ''}" id="feedback">${escapeHtml(persistentMessage)}</div><div class="button-row"><button class="btn btn-primary" id="checkBtn">Проверить</button></div><div class="help-panel ${firstWrong ? 'show' : ''}" id="helpPanel"><div class="button-row"><button class="btn btn-secondary" id="hintBtn" ${q.hintCount >= 2 ? 'disabled' : ''}>${q.hintCount === 0 ? 'Подсказка' : q.hintCount === 1 ? 'Ещё подсказка' : 'Подсказки открыты'}</button><button class="btn btn-quiet" id="solutionBtn">Посмотреть решение</button></div>${hintHtml}</div></div>` : `${completionNotice}${completionText}${solutionHtml}<div class="button-row"><button class="btn btn-primary" id="nextBtn">${completionButtonLabel(q)}</button></div>`;
      const motivation = milestoneText(state.questions.filter(x => x.completed).length);
      document.getElementById('app').innerHTML = `<div class="shell"><div class="topbar"><div class="brand">Математика с Дарьей</div><div class="timer">Время работы: <span id="timerText">${formatTime(totalElapsed())}</span></div></div>${progressHtml(activeIndex)}<div class="work-actions"><button class="btn btn-quiet" id="finishWorkBtn">Завершить работу</button></div><div class="motivation">${motivation}</div><section class="card question-card"><div class="question-head"><div><h2>Задание ${q.number}</h2></div><div class="counter">${q.number} / 13</div></div><div class="question-text">${def.text}</div>${def.visual || ''}${answerControls}</section></div>`;
      bindProgress();
      if (!completed) bindQuestion(q);
      else document.getElementById('nextBtn').addEventListener('click', nextQuestion);
      document.getElementById('finishWorkBtn').addEventListener('click', requestFinish);
      startTimer();
    }

    function milestoneText(done) {
      if (done === 4) return '4 из 13 позади';
      if (done === 8) return 'Больше половины готово';
      if (done === 11) return 'Осталось всего два задания';
      return '';
    }

    function bindProgress() {
      document.querySelectorAll('[data-question]').forEach(btn => btn.addEventListener('click', () => {
        navigateTo(Number(btn.dataset.question));
      }));
    }

    function navigateTo(index) {
      if (!state || state.finished || index < 0 || index >= state.questions.length) return;
      const current = state.questions[state.currentIndex];
      const input = document.getElementById('answerInput');
      if (input && !current.completed) current.currentAnswer = input.value;
      stopTiming(current);
      state.currentIndex = index;
      save();
      renderCurrent();
    }

    function bindQuestion(q) {
      const input = document.getElementById('answerInput');
      input.addEventListener('input', () => { q.currentAnswer = input.value; save(); document.getElementById('answerError').textContent = ''; });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); } });
      document.getElementById('checkBtn').addEventListener('click', checkAnswer);
      const hintBtn = document.getElementById('hintBtn');
      const solutionBtn = document.getElementById('solutionBtn');
      if (hintBtn) hintBtn.addEventListener('click', useHint);
      if (solutionBtn) solutionBtn.addEventListener('click', () => confirmDialog('Посмотреть полный разбор?', 'После просмотра решения ответ вводить будет нельзя.', 'Показать решение', viewSolution));
      window.setTimeout(() => input.focus(), 40);
    }

    function checkAnswer() {
      if (checking || !state) return;
      const q = state.questions[state.currentIndex];
      if (q.completed) return;
      const input = document.getElementById('answerInput');
      const raw = input.value;
      if (!raw.trim()) { document.getElementById('answerError').textContent = 'Введите ответ.'; input.focus(); return; }
      if (normalizeAnswer(raw) === null) { document.getElementById('answerError').textContent = 'Введите целое число или конечную десятичную дробь.'; input.focus(); return; }
      checking = true; document.getElementById('checkBtn').disabled = true;
      q.attempts += 1; q.studentAnswers.push(raw.trim()); q.currentAnswer = raw;
      const correct = answersEqual(raw, q.correctAnswer);
      if (q.attempts === 1) { q.firstAnswer = raw.trim(); q.firstAttemptCorrect = correct; q.score = correct ? 1 : 0; }
      if (correct) {
        stopTiming(q); q.completed = true;
        if (q.attempts === 1) q.status = 'first';
        else if (q.usedHint) q.status = 'hint';
        else q.status = 'corrected';
        save();
        renderCurrent(q.attempts === 1 ? '✓ Верно' : '✓ Теперь верно');
      } else {
        q.score = 0; save(); renderCurrent('Пока неверно. Попробуй ещё раз.');
      }
      checking = false;
    }

    function useHint() {
      const q = state.questions[state.currentIndex];
      if (q.completed || q.attempts === 0 || q.hintCount >= 2) return;
      q.hintCount += 1; q.usedHint = true; q.score = 0; save(); renderCurrent('');
    }

    function viewSolution() {
      closeDialog();
      const q = state.questions[state.currentIndex];
      if (q.completed || q.attempts === 0) return;
      stopTiming(q); q.viewedSolution = true; q.completed = true; q.status = 'solution'; q.score = 0; q.currentAnswer = ''; save(); renderCurrent();
    }

    function nextQuestion() {
      if (!state.questions[state.currentIndex].completed) return;
      const nextIndex = state.questions.findIndex(q => !q.completed);
      if (nextIndex >= 0) navigateTo(nextIndex);
      else requestFinish();
    }

    function requestFinish() {
      const input = document.getElementById('answerInput');
      if (input && !state.questions[state.currentIndex].completed) {
        state.questions[state.currentIndex].currentAnswer = input.value;
        save();
      }
      const incomplete = state.questions.filter(q => !q.completed);
      if (!incomplete.length) {
        confirmDialog('Завершить тренировку?', '', 'Завершить', finishTraining, 'Вернуться');
        return;
      }
      const numbers = incomplete.map(q => `№${q.number}`).join(' · ');
      const unfinishedTitle = `${incomplete.length === 1 ? 'Не завершено' : 'Не завершены'} ${incomplete.length} ${plural(incomplete.length, 'задание', 'задания', 'заданий')}`;
      confirmDialog(unfinishedTitle, `${numbers}\n\nТы можешь вернуться к ним или завершить работу без ответов.`, 'Завершить без ответов', finishWithoutAnswers, 'Вернуться к заданиям');
    }

    function finishWithoutAnswers() {
      closeDialog();
      state.questions.forEach(q => {
        stopTiming(q);
        if (!q.completed) {
          q.score = 0;
          q.status = 'skipped';
          q.completed = true;
        }
      });
      finishTraining();
    }

    function finishTraining() {
      if (!allQuestionsCompleted()) return;
      closeDialog();
      state.finished = true;
      state.completedAt = Date.now();
      save();
      renderFinal();
    }

    function confirmDialog(title, text, confirmLabel, onConfirm, cancelLabel = 'Вернуться') {
      const overlay = document.getElementById('overlay');
      overlay.innerHTML = `<div class="dialog"><h3 id="dialogTitle">${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p><div class="button-row"><button class="btn btn-quiet" id="cancelDialog">${escapeHtml(cancelLabel)}</button><button class="btn btn-danger" id="confirmDialog">${escapeHtml(confirmLabel)}</button></div></div>`;
      overlay.classList.add('show');
      document.getElementById('cancelDialog').addEventListener('click', closeDialog);
      document.getElementById('confirmDialog').addEventListener('click', onConfirm);
      document.getElementById('cancelDialog').focus();
    }

    function closeDialog() { const overlay = document.getElementById('overlay'); overlay.classList.remove('show'); overlay.innerHTML = ''; }

    function counts() {
      const out = { first:0, corrected:0, hint:0, solution:0, skipped:0 };
      state.questions.forEach(q => { if (q.status && Object.hasOwn(out, q.status)) out[q.status]++; });
      return out;
    }

    function renderFinal() {
      stopTimer();
      state.questions.forEach(stopTiming); state.finished = true; if (!state.completedAt) state.completedAt = Date.now(); save();
      const c = counts();
      const secure = state.questions.filter(q => q.status === 'first').map(q => q.topic);
      const revise = state.questions.filter(q => q.status !== 'first').map(q => q.topic);
      const map = state.questions.map(q => { const m = statusMeta[q.status]; return `<div class="map-item ${m.className}" style="background:${m.soft};color:${m.color};border-color:${m.color}45" title="${escapeHtml(m.label)}"><span>${q.number}<small>${m.symbol}</small></span></div>`; }).join('');
      document.getElementById('app').innerHTML = `<div class="shell"><div class="topbar"><div class="brand">Математика с Дарьей</div><div class="timer">Общее время: ${formatTime(totalElapsed())}</div></div><section class="card final-card"><div class="final-head"><div class="eyebrow">Первая часть завершена</div><h1>Результат первой попытки</h1><div class="score">${c.first} / 13</div></div><div class="stats"><div class="stat"><b>${c.first}</b><span>Верно с первой попытки</span></div><div class="stat"><b>${c.corrected}</b><span>Исправлено самостоятельно</span></div><div class="stat"><b>${c.hint}</b><span>Решено с подсказкой</span></div><div class="stat"><b>${c.solution}</b><span>Посмотрено решение</span></div><div class="stat"><b>${c.skipped}</b><span>Пропущено</span></div></div><h3>Карта результатов</h3><div class="result-map">${map}</div><div class="legend">${Object.values(statusMeta).map(m => `<span><i class="dot" style="background:${m.color}"></i>${m.symbol} ${m.short}</span>`).join('')}</div><div class="analysis-grid"><div class="analysis-box"><h3>Что получилось уверенно</h3><p>${secure.length ? escapeHtml(secure.join(' · ')) : 'В этот раз задания не были решены верно с первой попытки — результаты помогут выбрать темы для повторения.'}</p></div><div class="analysis-box"><h3>Что стоит повторить</h3><p>${revise.length ? escapeHtml(revise.join(' · ')) : 'Все темы выполнены уверенно с первой попытки.'}</p></div></div><div class="final-actions"><button class="btn btn-primary" id="downloadPng">Скачать отчёт для преподавателя PNG</button><button class="btn btn-quiet" id="restartBtn">Начать заново</button></div></section></div>`;
      document.getElementById('downloadPng').addEventListener('click', downloadReport);
      document.getElementById('restartBtn').addEventListener('click', () => confirmDialog('Начать заново?', 'Текущий результат будет удалён.', 'Начать заново', () => { clearSaved(); state = null; closeDialog(); renderStart(null); }));
    }

    function startTimer() {
      stopTimer();
      timerHandle = window.setInterval(() => { const el = document.getElementById('timerText'); if (el) el.textContent = formatTime(totalElapsed()); }, 1000);
    }
    function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
      const words = String(text).split(/\s+/); const lines = []; let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; } else line = test;
      }
      if (line) lines.push(line);
      const shown = lines.slice(0, maxLines);
      if (lines.length > maxLines) {
        let last = shown[maxLines - 1];
        while (ctx.measureText(last + '…').width > maxWidth && last.length) last = last.slice(0, -1);
        shown[maxLines - 1] = last + '…';
      }
      shown.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineHeight));
      return shown.length;
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function downloadReport() {
      const canvas = document.createElement('canvas'); canvas.width = 2400; canvas.height = 3200;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#f6f8f3'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.textBaseline = 'top'; ctx.fillStyle = '#245741'; ctx.font = '800 34px Arial, sans-serif'; ctx.fillText('Математика с Дарьей', 120, 90);
      ctx.fillStyle = '#1d2a25'; ctx.font = '900 64px Arial, sans-serif'; ctx.fillText('ЕГЭ | Первая часть | задания 1–13', 120, 150);
      ctx.fillStyle = '#69756f'; ctx.font = '500 30px Arial, sans-serif'; ctx.fillText('Вариант №5', 120, 236);
      const date = new Date(state.completedAt || Date.now()).toLocaleDateString('ru-RU');
      ctx.textAlign = 'right'; ctx.fillText(`Ученик: ${state.studentName}`, 2280, 94); ctx.fillText(`Дата: ${date}`, 2280, 144); ctx.fillText(`Общее время: ${formatTime(totalElapsed())}`, 2280, 194); ctx.textAlign = 'left';
      roundRect(ctx, 120, 310, 2160, 235, 28, '#ffffff', '#dce4df');
      ctx.fillStyle = '#69756f'; ctx.font = '700 29px Arial, sans-serif'; ctx.fillText('Результат первой попытки', 170, 356);
      const c = counts(); ctx.fillStyle = '#245741'; ctx.font = '900 82px Arial, sans-serif'; ctx.fillText(`${c.first} / 13`, 170, 402);
      const summary = [['Верно сразу',c.first],['Исправлено',c.corrected],['С подсказкой',c.hint],['Решение',c.solution],['Пропущено',c.skipped]];
      summary.forEach((item,i) => { const x = 670 + i*310; ctx.fillStyle='#1d2a25'; ctx.font='800 43px Arial, sans-serif'; ctx.fillText(String(item[1]),x,370); ctx.fillStyle='#69756f';ctx.font='500 24px Arial, sans-serif';wrapCanvasText(ctx,item[0],x,430,255,30,2); });

      const tableX=120, tableY=600, rowH=108, widths=[100,420,330,650,180,180,300], headers=['№','Тема','Первая попытка','Статус','Попытки','Подсказки','Время'];
      let x=tableX; ctx.lineWidth=2; ctx.font='700 24px Arial, sans-serif';
      headers.forEach((h,i)=>{ctx.fillStyle='#e5f0e9';ctx.fillRect(x,tableY,widths[i],90);ctx.strokeStyle='#c9d6cf';ctx.strokeRect(x,tableY,widths[i],90);ctx.fillStyle='#245741';wrapCanvasText(ctx,h,x+16,tableY+29,widths[i]-32,29,2);x+=widths[i];});
      state.questions.forEach((q,row)=>{
        const y=tableY+90+row*rowH; x=tableX; const vals=[String(q.number),q.topic,q.firstAttemptCorrect===true?'✓':(q.firstAnswer||'—'),statusMeta[q.status].label,String(q.attempts),String(q.hintCount),formatTime(q.elapsedTime)];
        vals.forEach((v,i)=>{ctx.fillStyle=row%2===0?'#ffffff':'#fafcfb';ctx.fillRect(x,y,widths[i],rowH);ctx.strokeStyle='#dce4df';ctx.strokeRect(x,y,widths[i],rowH);ctx.fillStyle=i===3?statusMeta[q.status].color:'#1d2a25';ctx.font=(i===0?'800 ':'500 ')+'23px Arial, sans-serif';if(i===2&&v==='✓'){ctx.strokeStyle='#34765b';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+24,y+53);ctx.lineTo(x+37,y+68);ctx.lineTo(x+66,y+35);ctx.stroke();ctx.lineWidth=2;}else{wrapCanvasText(ctx,v,x+15,y+22,widths[i]-30,29,i===3?3:2);}x+=widths[i];});
      });

      const attentionY = tableY + 90 + 13*rowH + 65;
      ctx.fillStyle='#1d2a25'; ctx.font='800 38px Arial, sans-serif'; ctx.fillText('Обратить внимание',120,attentionY);
      const elapsedSorted = state.questions.map(q=>q.elapsedTime).filter(Boolean).sort((a,b)=>a-b); const median = elapsedSorted.length ? elapsedSorted[Math.floor(elapsedSorted.length/2)] : 0;
      const flagged=state.questions.filter(q=>q.status!=='first'||q.hintCount>0||(median&&q.elapsedTime>median*1.8));
      if (!flagged.length) { ctx.fillStyle='#69756f';ctx.font='500 26px Arial, sans-serif';ctx.fillText('Все задания решены верно с первой попытки.',120,attentionY+62); }
      else {
        ctx.font='500 24px Arial, sans-serif';
        flagged.forEach((q,i)=>{const yy=attentionY+66+i*48;ctx.fillStyle=statusMeta[q.status].color;ctx.font='800 24px Arial, sans-serif';ctx.fillText(`№${q.number} — ${q.topic}`,120,yy);ctx.fillStyle='#69756f';ctx.font='500 24px Arial, sans-serif';const details=[statusMeta[q.status].short,`${q.attempts} ${plural(q.attempts,'попытка','попытки','попыток')}`,q.hintCount?`${q.hintCount} ${plural(q.hintCount,'подсказка','подсказки','подсказок')}`:null,formatTime(q.elapsedTime)].filter(Boolean).join(' · ');ctx.fillText(details,780,yy);});
      }
      ctx.fillStyle='#829089';ctx.font='500 20px Arial, sans-serif';ctx.fillText('Отчёт сформирован тренажёром «13 из 13»',120,3135);
      canvas.toBlob(blob => {
        if (!blob) return;
        const url=URL.createObjectURL(blob); const link=document.createElement('a'); const safeName=state.studentName.replace(/[^\p{L}\p{N}_-]+/gu,'_').replace(/^_+|_+$/g,'')||'ученик';
        link.href=url; link.download=`ЕГЭ_13_из_13_${safeName}.png`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
      },'image/png');
    }

    function plural(n, one, few, many) {
      const n10=n%10,n100=n%100; if(n10===1&&n100!==11)return one;if(n10>=2&&n10<=4&&(n100<12||n100>14))return few;return many;
    }

    window.addEventListener('beforeunload', () => {
      if (state && !state.finished && state.questions[state.currentIndex]) { stopTiming(state.questions[state.currentIndex]); save(); }
    });

    window.__trainerTest = { normalizeAnswer, answersEqual, createState, questionDefinitions, statusMeta, formatTime };

    document.addEventListener('DOMContentLoaded', () => {
      const saved = safeLoad();
      if (saved && saved.finished) { state = saved; renderFinal(); }
      else renderStart(saved);
    });
  </script>
